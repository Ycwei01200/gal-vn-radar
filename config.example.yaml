follow:
  # Optional overrides. Auto-discovery works even when these lists are empty.
  developers:
    - ケロQ
    - 枕
    - ゆずソフト
  visual_novels: []
  tags:
    - denpa
    - nakige
    - utsuge
  steam_apps: []
  itch_apps: []
  feeds: []

discovery:
  enabled: true
  # Recent VNDB titles are the discovery universe. VNDB extlinks are then used
  # to build external-source mappings without fuzzy title matching.
  vndb_results: 50
  steam_from_vndb_extlinks: true
  itch_from_vndb_extlinks: true
  feeds_from_vndb_extlinks: true

preferences:
  languages:
    - ja
    - zh-Hant
  source_priority:
    - vndb
    - steam
    - itch.io
    - rss

notification:
  immediate_threshold: 70
  digest_threshold: 40
  max_snapshot_release_age_days: 30
  enabled_event_types:
    - NEW_TITLE
    - RELEASE_DATE
    - RELEASED
    - DELAY
    - DEMO
    - PATCH
    - LOCALIZATION
    - STEAM_PAGE
    - DEVLOG
    - TRAILER
    - OTHER
